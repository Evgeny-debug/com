<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Дошка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */
:root{
  --bg:#F2F2F7;
  --surface:rgba(255,255,255,0.70);
  --surface-solid:#FFFFFF;
  --surface-strong:rgba(255,255,255,0.92);
  --border:rgba(60,60,67,0.12);
  --text:#0B0D10;
  --text-secondary:#6B7076;
  --text-tertiary:#9A9DA3;
  --accent:#229ED9;
  --accent-strong:#1B87BD;
  --accent-soft:rgba(34,158,217,0.12);
  --good:#34C759;
  --warn:#FF9F0A;
  --bad:#FF3B30;
  --nav-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --radius-l:20px;
  --radius-m:14px;
  --radius-s:10px;
  --shadow:0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#000000;
  --surface:rgba(28,28,30,0.68);
  --surface-solid:#1C1C1E;
  --surface-strong:rgba(28,28,30,0.92);
  --border:rgba(255,255,255,0.10);
  --text:#FFFFFF;
  --text-secondary:#98989F;
  --text-tertiary:#6C6C70;
  --accent:#3AA8E0;
  --accent-strong:#57B7EA;
  --accent-soft:rgba(58,168,224,0.16);
  --good:#30D158;
  --warn:#FF9F0A;
  --bad:#FF453A;
  --shadow:0 1px 2px rgba(0,0,0,0.20), 0 4px 12px rgba(0,0,0,0.25);
  color-scheme: dark;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{display:none;}

#app{
  max-width:560px;
  margin: 0 auto;
  min-height:100%;
  position:relative;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 34px);
}

/* ==========================================================================
   TOP BAR (Виправлено під iPhone XS та iOS шторку)
   ========================================================================== */
.topbar-wrap{
  position:sticky; top:0; z-index:20;
  padding-top:max(env(safe-area-inset-top), 10px);
  background:transparent;
  pointer-events:none; /* Пропускає кліки крізь контейнер */
}
.topbar{
  pointer-events:auto;
  margin:0 10px 10px;
  padding:8px 12px;
  background:var(--surface-strong);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border);
  border-radius:var(--radius-l);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  box-shadow:var(--shadow);
  transition: max-width .3s ease, border-radius .3s ease, padding .3s ease, margin .3s ease, justify-content .3s ease;
}

/* Піксельний градієнтний логотип */
.gu-logo {
  font-family: 'Press Start 2P', monospace;
  font-size:10px; /* Маленьке до скролу */
  background: linear-gradient(135deg, #FFD700 0%, #0057B7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  margin:0; cursor:pointer;
  line-height:1.4;
  transition: font-size .3s ease;
}
.topbar .sub{font-size:11px; color:var(--text-secondary); margin-top:2px; font-weight:500; transition:opacity .2s;}
.avatar-chip{
  display:flex; align-items:center; gap:6px;
  background:var(--surface-solid); border:1px solid var(--border);
  padding:4px 8px 4px 4px; border-radius:999px;
  transition:opacity .2s;
}
.head-actions{display:flex; align-items:center; gap:6px; transition:opacity .2s;}
.fav-header-btn{
  width:28px;height:28px;border-radius:50%;
  background:var(--surface-solid); border:1px solid var(--border);
  color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.avatar-dot{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10px;font-weight:700; overflow:hidden;
}
.avatar-dot img { width:100%; height:100%; object-fit:cover; }
.admin-badge{
  font-size:9px; font-weight:700; color:var(--accent);
  background:var(--accent-soft); padding:2px 6px; border-radius:4px; letter-spacing:0.2px;
}

/* Топбар при скролі */
.topbar.scrolled{
  max-width:260px;
  margin:0 auto 10px;
  border-radius:999px;
  padding:10px 16px;
  justify-content:center;
}
.topbar.scrolled .sub,
.topbar.scrolled .avatar-chip,
.topbar.scrolled .head-actions{
  display:none;
  opacity:0;
}
.topbar.scrolled .gu-logo{
  font-size:14px; /* Збільшується при скролі */
  text-align:center;
}

/* ==========================================================================
   VIEWS
   ========================================================================== */
.view{display:none; padding:6px 10px 6px;} /* Ультракомпактні відступи */
.view.active{display:block;}

/* Banners */
.banner-rail{
  display:flex; gap:8px; overflow-x:auto; scroll-snap-type:none; /* Прибрали snap для js автоскролу */
  margin:0 -10px 4px; padding:0 10px;
}
.banner-card{
  flex:0 0 88%;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  min-height:130px;
  background:var(--surface-solid);
  border:1px solid var(--border);
  cursor:pointer;
}
.banner-card img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
}
.banner-card .scrim{
  position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.1) 100%);
}
.banner-card .banner-text{
  position:absolute; left:10px; right:10px; bottom:8px; color:#fff;
}
.banner-card .banner-text .t{font-weight:700; font-size:13px; margin:0 0 2px; text-shadow:0 1px 3px rgba(0,0,0,0.4);}
.banner-card .banner-text .d{font-size:11px; opacity:0.9; margin:0; text-shadow:0 1px 3px rgba(0,0,0,0.4);}

/* Таймер банеру */
.banner-timer-wrap {
  display:flex; align-items:center; justify-content:center;
  margin-bottom:10px; height:12px;
}
.banner-timer-svg {
  width:14px; height:14px; transform:rotate(-90deg);
}
.banner-timer-svg circle {
  fill:none; stroke:var(--accent); stroke-width:2.5;
  stroke-dasharray:38; stroke-dashoffset:38;
}

/* Category chips */
.chip-row{
  display:flex; gap:6px; overflow-x:auto; margin:0 -10px 10px; padding:0 10px;
  transition:opacity .25s, max-height .25s, margin .25s;
  max-height:60px; opacity:1;
}
.chip-row.hide-scroll{ opacity:0; max-height:0; margin-bottom:0; overflow:hidden; pointer-events:none; }
.chip{
  flex:0 0 auto; padding:6px 12px; border-radius:999px;
  background:var(--surface-solid); border:1px solid var(--border);
  font-size:11px; font-weight:600; color:var(--text-secondary); cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}

/* Compact 3-col item grid */
.item-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:6px;
}
.item-card-mini{
  background:var(--surface-solid);
  border:1px solid var(--border);
  border-radius:var(--radius-s);
  overflow:hidden;
  box-shadow:var(--shadow);
  cursor:pointer;
}
.mini-media{
  position:relative; width:100%; aspect-ratio:1/1;
  background:var(--accent-soft); overflow:hidden;
}
.mini-media img{width:100%; height:100%; object-fit:cover; display:block;}
.mini-media .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}
.mini-ttl{
  position:absolute; top:4px; left:4px;
  background:rgba(0,0,0,0.55); backdrop-filter:blur(3px);
  color:#fff; font-size:8px; font-weight:700; padding:2px 4px; border-radius:999px; z-index:2;
}
.mini-cat{
  position:absolute; bottom:4px; left:4px; max-width:calc(100% - 10px);
  background:rgba(0,0,0,0.55); backdrop-filter:blur(3px);
  color:#fff; font-size:8px; font-weight:600; padding:2px 4px; border-radius:999px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:2;
}
.mini-heart{
  position:absolute; top:4px; right:4px; z-index:2;
  width:22px; height:22px; border-radius:50%;
  background:rgba(0,0,0,0.4); backdrop-filter:blur(3px);
  border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;
}
.mini-heart svg{width:12px; height:12px;}
.mini-title{
  font-size:11px; font-weight:700; margin:4px 6px 2px; line-height:1.2;
  min-height:26px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.mini-price{font-size:10.5px; font-weight:800; color:var(--accent); margin:0 6px 6px;}

.load-more-wrap{margin-top:10px; display:flex; justify-content:center;}
.load-more-btn{
  padding:8px 24px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface-solid); color:var(--accent); font-weight:700; font-size:12px; cursor:pointer;
}

.btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:4px;
  padding:8px 10px; border-radius:var(--radius-s); border:none; cursor:pointer;
  font-size:11px; font-weight:700;
}
.btn-outline{background:var(--accent-soft); color:var(--accent);}
.btn-solid{background:var(--accent); color:#fff;}
.btn-solid:active,.btn-outline:active{opacity:0.7;}

/* Футер */
.footer-block{
  margin-top:20px; padding:16px; background:var(--surface-solid);
  border:1px solid var(--border); border-radius:var(--radius-m); text-align:center;
}
.footer-block .t{font-size:12px; font-weight:800; color:var(--text); margin:0 0 10px;}
.footer-block .d{font-size:10px; color:var(--text-secondary); margin:10px 0 0;}

.empty-state{
  text-align:center; padding:24px 10px; color:var(--text-secondary);
}
.empty-state svg{margin-bottom:6px; opacity:0.5;}
.empty-state .t{font-weight:700; color:var(--text); margin:0 0 2px;}
.empty-state .d{font-size:11px; margin:0;}

/* Item full-info & Modals (Bottom Sheet with Blur) */
.item-modal-overlay{
  position:fixed; inset:0; z-index:60;
  display:flex; flex-direction:column; justify-content:flex-end;
  visibility:hidden; opacity:0; pointer-events:none;
  transition:visibility 0.3s, opacity 0.3s;
}
.item-modal-overlay.active{
  visibility:visible; opacity:1; pointer-events:auto;
}
.modal-backdrop {
  position:absolute; inset:0;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.modal-bottom-sheet {
  position:relative; z-index:2;
  background:var(--bg);
  height:90vh; 
  border-radius:22px 22px 0 0;
  display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
}
.item-modal-overlay.active .modal-bottom-sheet {
  transform:translateY(0);
}
.item-modal-head{
  display:flex; align-items:center; justify-content:flex-end;
  padding:12px 14px 4px;
}
.item-modal-body{flex:1; overflow-y:auto; padding:0 14px 24px;}

.gallery{
  position:relative; width:100%; aspect-ratio:1/1;
  border-radius:var(--radius-m); overflow:hidden; background:var(--accent-soft); margin-bottom:10px;
}
.gallery-track{display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory;}
.gallery-track img{flex:0 0 100%; width:100%; height:100%; object-fit:cover; scroll-snap-align:start; display:block;}
.gallery-dots{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); display:flex; gap:4px;}
.gallery-dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.5);}
.gallery-dots span.active{background:#fff;}
.modal-heart-row{display:flex; justify-content:flex-end; margin-bottom:4px;}
.heart-btn-lg{
  width:34px;height:34px;border-radius:50%; background:var(--surface-solid); border:1px solid var(--border);
  color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.heart-btn-lg svg{width:17px;height:17px;}
.modal-title{font-size:17px; font-weight:800; margin:0 0 4px; letter-spacing:-0.3px;}
.modal-price{font-size:15px; font-weight:800; color:var(--accent); margin:0 0 6px;}
.modal-cat-pill{
  display:inline-block; background:var(--accent-soft); color:var(--accent);
  font-size:10px; font-weight:700; padding:4px 8px; border-radius:999px; margin-bottom:10px;
}
.modal-desc{font-size:12px; color:var(--text-secondary); line-height:1.5; margin:0 0 12px; white-space:pre-wrap;}
.modal-meta-row{display:flex; gap:12px; margin-bottom:14px; font-size:10px; color:var(--text-tertiary);}
.modal-meta-row span{display:flex; align-items:center; gap:4px;}
.modal-actions{display:flex; gap:6px;}
.modal-actions .btn{padding:10px; font-size:12px; border-radius:var(--radius-m);}

/* Chat view */
.chat-list{display:flex; flex-direction:column; gap:6px;}
.chat-row{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-solid); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:8px 10px;
  cursor:pointer;
}
.chat-row .icon-wrap{
  width:36px;height:36px;border-radius:50%;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center; color:var(--accent); flex:0 0 auto; overflow:hidden;
}
.chat-row .icon-wrap img { width:100%; height:100%; object-fit:cover; }
.chat-row .chat-info{flex:1; min-width:0;}
.chat-row .chat-info .t{font-weight:700; font-size:12px; margin:0 0 2px;}
.chat-row .chat-info .d{font-size:10px; color:var(--text-secondary); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.support-card{
  background:linear-gradient(135deg, var(--accent), var(--accent-strong));
  border-radius:var(--radius-m); padding:10px; color:#fff; margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.support-card .icon-wrap{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.18);
  display:flex;align-items:center;justify-content:center; flex:0 0 auto;
}
.support-card .t{font-weight:700; font-size:13px; margin:0 0 2px;}
.support-card .d{font-size:10px; opacity:0.85; margin:0;}

/* Create & Admin form */
.form-section{margin-bottom:10px;}
.form-label{font-size:10px; font-weight:700; color:var(--text-secondary); margin:0 0 4px; text-transform:uppercase; letter-spacing:0.3px;}
.field{
  background:var(--surface-solid); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:8px 10px; margin-bottom:6px;
}
.field input, .field textarea{
  width:100%; border:none; outline:none; background:transparent; color:var(--text);
  font-size:13px; resize:none;
}
.field textarea{min-height:60px; line-height:1.3;}
.file-input-wrap {
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: 8px 10px;
  margin-bottom: 6px;
}
.file-input-wrap input[type="file"] {
  width: 100%;
  font-size: 11px;
  color: var(--text);
}
.cat-select-row{display:flex; flex-wrap:wrap; gap:4px;}
.cat-opt{
  padding:6px 10px; border-radius:999px; background:var(--surface-solid);
  border:1px solid var(--border); font-size:11px; font-weight:600; color:var(--text-secondary); cursor:pointer;
}
.cat-opt.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.cooldown-banner{
  display:flex; align-items:center; gap:8px; background:var(--accent-soft);
  border-radius:var(--radius-m); padding:10px; margin-bottom:10px; color:var(--text);
}
.cooldown-banner .icon-wrap{color:var(--accent); flex:0 0 auto;}
.cooldown-banner .t{font-weight:700; font-size:12px; margin:0 0 2px;}
.cooldown-banner .d{font-size:10px; color:var(--text-secondary); margin:0;}
.submit-btn{
  width:100%; padding:10px; border:none; border-radius:var(--radius-m);
  background:var(--accent); color:#fff; font-weight:700; font-size:13px; cursor:pointer;
}
.submit-btn:disabled{background:var(--text-tertiary); cursor:not-allowed;}
.hint{font-size:10px; color:var(--text-tertiary); margin:4px 2px 0;}

/* Profile view */
.profile-head{
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
}
.profile-avatar{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  display:flex;align-items:center;justify-content:center; color:#fff; font-size:18px; font-weight:700;
  overflow:hidden;
}
.profile-avatar img { width:100%; height:100%; object-fit:cover; }
.profile-name{font-size:15px; font-weight:800; margin:0 0 2px; letter-spacing:-0.3px;}
.profile-id{font-size:10px; color:var(--text-secondary); margin:0;}
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px;}
.stat-card{
  background:var(--surface-solid); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:8px 6px; text-align:center;
}
.stat-card .num{font-size:15px; font-weight:800; margin:0 0 2px; letter-spacing:-0.3px;}
.stat-card .lbl{font-size:8px; color:var(--text-secondary); margin:0; font-weight:600; text-transform:uppercase; letter-spacing:0.2px;}
.section-title{font-size:13px; font-weight:800; margin:12px 0 6px; letter-spacing:-0.3px;}
.mine-row{
  display:flex; align-items:center; gap:8px;
  background:var(--surface-solid); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:6px 8px; margin-bottom:4px;
}
.mine-row img{width:36px;height:36px;border-radius:8px;object-fit:cover; flex:0 0 auto; background:var(--accent-soft);}
.mine-row .info{flex:1; min-width:0;}
.mine-row .t{font-size:11px; font-weight:700; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mine-row .d{font-size:9px; color:var(--text-secondary); margin:0;}
.status-dot{width:5px;height:5px;border-radius:50%; display:inline-block; margin-right:4px;}
.status-dot.live{background:var(--good);}
.status-dot.dead{background:var(--text-tertiary);}

.admin-panel{
  border:1px solid var(--accent); border-radius:var(--radius-l); padding:10px; margin-top:14px;
  background:var(--accent-soft);
}
.admin-panel .head{display:flex; align-items:center; gap:6px; margin-bottom:8px; color:var(--accent); font-weight:800; font-size:12px;}
.admin-item-row{
  display:flex; align-items:center; gap:6px; background:var(--surface-solid);
  border-radius:var(--radius-s); padding:6px 8px; margin-bottom:4px;
}
.admin-item-row .info{flex:1; min-width:0;}
.admin-item-row .t{font-size:11px; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.admin-item-row .d{font-size:9px; color:var(--text-secondary); margin:0;}
.icon-btn{
  width:24px;height:24px; border-radius:6px; border:none; background:var(--bad); color:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}

/* Bottom bar: capsule nav + separate round search button */
.bottom-bar-wrap{
  position:fixed; left:0; right:0; bottom:calc(10px + var(--safe-b)); z-index:30;
  max-width:560px; margin:0 auto; padding:0 10px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:all .3s;
}
.bottom-nav{
  flex:1 1 auto; max-width:420px;
  height:var(--nav-h);
  background:var(--surface-strong);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border);
  border-radius:999px;
  display:flex; align-items:stretch;
  box-shadow:var(--shadow);
  padding:0 2px;
}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; background:none; border:none; color:var(--text-tertiary); cursor:pointer;
}
.nav-btn.active{color:var(--accent);}
.nav-btn span{font-size:9px; font-weight:600;}
.nav-btn-create .icon-circle{
  width:26px;height:26px;border-radius:50%;
  background:var(--accent); color:#fff;

window.uploadToImgBB = async function(fileInput, hiddenInputId, statusId) {
  const file = fileInput.files[0];
  if (!file) return;
  const statusText = document.getElementById(statusId);
  const hiddenUrlInput = document.getElementById(hiddenInputId);
  statusText.innerText = "⏳ Завантаження...";
  statusText.style.color = "var(--accent)";
  const formData = new FormData();
  formData.append("image", file);
  try {
    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
    const data = await response.json();
    if (data.success) {
      hiddenUrlInput.value = data.data.url;
      statusText.innerText = "✅ Завантажено!";
      statusText.style.color = "var(--good)";
    } else {
      statusText.innerText = "❌ Помилка: " + data.error.message;
      statusText.style.color = "var(--bad)";
    }
  } catch (error) {
    statusText.innerText = "❌ Помилка мережі.";
    statusText.style.color = "var(--bad)";
  }
};

window.uploadMultipleToImgBB = async function(fileInput, hiddenInputId, statusId) {
  const files = Array.from(fileInput.files || []).slice(0, CONFIG.MAX_PHOTOS);
  if (!files.length) return;
  const statusText = document.getElementById(statusId);
  const hiddenUrlInput = document.getElementById(hiddenInputId);
  statusText.innerText = "⏳ Завантаження (0/" + files.length + ")…";
  statusText.style.color = "var(--accent)";
  const urls = [];
  for (let i = 0; i < files.length; i++){
    try {
      const formData = new FormData();
      formData.append("image", files[i]);
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
      const data = await response.json();
      if (data.success) {
        urls.push(data.data.url);
        statusText.innerText = "⏳ (" + urls.length + "/" + files.length + ")…";
      } else {
        statusText.innerText = "❌ Помилка: " + data.error.message;
        statusText.style.color = "var(--bad)";
      }
    } catch (error) {
      statusText.innerText = "❌ Помилка мережі.";
      statusText.style.color = "var(--bad)";
    }
  }
  hiddenUrlInput.value = urls.join("|");
  if (urls.length) {
    statusText.innerText = "✅ Завантажено: " + urls.length;
    statusText.style.color = "var(--good)";
  }
};

function fetchCsv(url){
  return new Promise(function(resolve){
    if (!isConfigured(url)) { resolve([]); return; }
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(res){ resolve(res.data || []); },
      error: function(){ resolve([]); }
    });
  });
}

async function loadAll(){
  const [banners, items, admins] = await Promise.all([
    fetchCsv(CONFIG.SHEETS.banners),
    fetchCsv(CONFIG.SHEETS.items),
    fetchCsv(CONFIG.SHEETS.admins)
  ]);
  const sheetBanners = banners.filter(function(b){ return b.title || b.img; });
  const bannerIds = new Set(sheetBanners.map(b => b.id || b.title));
  state.banners = sheetBanners.concat(state.banners.filter(b => !bannerIds.has(b.id || b.title)));

  state.admins = admins;
  state.adminIds = new Set(admins.map(a => String(a.telegram_id || "").trim()));
  
  const sheetItems = items
    .filter(function(it){ return it.title && !state.deletedIds.has(it.id || (it.user_id + "_" + it.created_at)); })
    .map(normalizeItem);

  const sheetIds = new Set(sheetItems.map(function(i){ return i.id; }));
  const merged = sheetItems.concat(state.localItems.filter(function(i){ return !sheetIds.has(i.id) && !state.deletedIds.has(i.id); }));
  state.items = merged;
  state.isAdmin = state.adminIds.has(CURRENT_UID);

  if (isFirstLoad) {
    renderAll();
    isFirstLoad = false;
  } else {
    softUpdate();
  }
}

function normalizeItem(raw){
  return {
    id: raw.id || (raw.user_id + "_" + raw.created_at),
    category: raw.category || "Інше",
    title: raw.title || "",
    desc: raw.desc || "",
    price: raw.price || "",
    img: raw.img || "",
    username: raw.username || "",
    phone: raw.phone || "",
    user_id: String(raw.user_id || ""),
    user_photo: raw.user_photo || "", 
    created_at: Number(raw.created_at) || Date.parse(raw.created_at) || Date.now(),
    clicks_phone: Number(raw.clicks_phone || raw.clicks || 0) || 0,
    clicks_tg: Number(raw.clicks_tg || 0) || 0
  };
}

function getImages(item){
  return String(item.img || "").split("|").map(function(s){ return s.trim(); }).filter(Boolean);
}

async function callAppsScript(action, payload){
  if (!isConfigured(CONFIG.APPS_SCRIPT_URL)) return { ok:false, demo:true };
  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ action: action }, payload))
    });
    return await res.json();
  } catch(e){
    return { ok:false, error: String(e) };
  }
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
  });
}
function initials(name){ return (name || "?").trim().charAt(0).toUpperCase(); }
function isAlive(item){ 
  if (state.adminIds.has(String(item.user_id))) return true; 
  return (Date.now() - item.created_at) < CONFIG.POST_TTL_MS; 
}
function timeLeftMs(item){ 
  if (state.adminIds.has(String(item.user_id))) return 999999999;
  return Math.max(0, CONFIG.POST_TTL_MS - (Date.now() - item.created_at)); 
}
function fmtClock(ms){
  if (ms > 900000000) return "∞";
  const s = Math.ceil(ms/1000);
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const r = s%60;
  if (h > 0) return h + ":" + String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0");
  return m + ":" + String(r).padStart(2,"0");
}
function timeAgo(ts){
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if (min < 1) return "щойно";
  if (min < 60) return min + " хв тому";
  const h = Math.floor(min/60);
  if (h < 24) return h + " год тому";
  return Math.floor(h/24) + " дн тому";
}
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
}

function getUserWeeklyPosts() {
  return state.items.filter(function(i) {
    return String(i.user_id) === CURRENT_UID && (Date.now() - i.created_at) < CONFIG.WEEK_MS;
  });
}

function getWeeklyCooldownRemaining() {
  if (state.isAdmin) return 0;
  const recent = getUserWeeklyPosts();
  if (recent.length < 3) return 0; 
  const oldest = recent.sort(function(a, b) { return a.created_at - b.created_at; })[0];
  return Math.max(0, CONFIG.WEEK_MS - (Date.now() - oldest.created_at));
}

function fmtDuration(ms){
  const totalMin = Math.ceil(ms/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  if (days > 0) return days + " дн " + hours + " год";
  const h = Math.floor(totalMin/60), m = totalMin%60;
  if (h > 0) return h + " год " + m + " хв";
  return m + " хв";
}

// Auto scroll Banners with infinite logic & timer
let bannerTimerInterval;
function renderBanners(){
  const rail = document.getElementById("bannerRail");
  const wrap = document.getElementById("bannerTimerWrap");
  if (!state.banners.length){
    rail.innerHTML = '<div class="empty-state" style="padding:10px;">Немає активних банерів</div>';
    wrap.style.display = 'none';
    clearInterval(bannerTimerInterval);
    return;
  }
  rail.innerHTML = state.banners.map(function(b, idx){
    return '<div class="banner-card" data-idx="'+idx+'">' +
      (b.img ? '<img src="'+esc(b.img)+'" alt="">' : '') +
      '<div class="scrim"></div>' +
      '<div class="banner-text"><p class="t">'+esc(b.title)+'</p><p class="d">'+esc(b.desc||"")+'</p></div>' +
    '</div>';
  }).join("");
  rail.querySelectorAll(".banner-card").forEach(function(card){
    card.addEventListener("click", function(){
      const b = state.banners[Number(card.dataset.idx)];
      callAppsScript("logAnalytics", { type:"banner_click", ref: b.title, user_id: CURRENT_UID });
      if (b.link) {
        if (tg && tg.openLink) tg.openLink(b.link); else window.open(b.link, "_blank");
      }
    });
  });

  if (state.banners.length > 1) {
    wrap.style.display = 'flex';
    initBannerAutoScroll();
  } else {
    wrap.style.display = 'none';
    clearInterval(bannerTimerInterval);
  }
}

function initBannerAutoScroll() {
  clearInterval(bannerTimerInterval);
  const rail = document.getElementById("bannerRail");
  const timerCircle = document.getElementById("bannerTimerCircle");
  
  if(timerCircle) {
    timerCircle.style.animation = 'none';
    void timerCircle.offsetWidth; 
    timerCircle.style.animation = 'countdown 5s linear infinite';
  }

  bannerTimerInterval = setInterval(() => {
    if (!rail || rail.children.length < 2) return;
    const first = rail.firstElementChild;
    const w = first.offsetWidth + 8; // width + gap
    rail.scrollBy({left: w, behavior: 'smooth'});
    setTimeout(() => {
      rail.appendChild(first);
      rail.scrollBy({left: -w, behavior: 'instant'});
    }, 400); // 400ms time for smooth scroll to finish
  }, 5000);
}

    card.addEventListener("click", function(e){
      if (e.target.closest(".mini-heart")) return;
      openItemModal(item);
    });
    const heartBtn = card.querySelector(".mini-heart");
    if (heartBtn) {
      heartBtn.addEventListener("click", function(e){

        heartBtn.innerHTML = isFav(item.id) ? ICONS.heartFilled : ICONS.heart;

    }
  });

function renderItemGrid(){
  const grid = document.getElementById("itemGrid");
  const loadWrap = document.getElementById("loadMoreWrap");
  const list = state.items
    .filter(isAlive)
    .filter(function(i){ return state.activeCategory === "Усі" || i.category === state.activeCategory; })
    .sort(function(a,b){ return b.created_at - a.created_at; });

  if (!list.length){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">' + ICONS.empty +
      '<p class="t">Поки що порожньо</p>' +
      '<p class="d">У цій категорії немає активних оголошень</p></div>';
    loadWrap.innerHTML = "";
    return;
  }

  const visible = list.slice(0, state.visibleCount);
  grid.innerHTML = visible.map(function(i){ return itemCardMiniHtml(i); }).join("");
  bindItemCardActions(grid);

  if (list.length > state.visibleCount){
    loadWrap.innerHTML = '<button class="load-more-btn" id="loadMoreBtn">Ще</button>';

      state.visibleCount += CONFIG.PAGE_SIZE;

}

    ? '<p class="hint" style="color:var(--accent);font-weight:700;">Режим адміна: безліміт, без видалення через добу</p>'
    : '<p class="hint">Використано публікацій на цьому тижні: <b>'+userWeeklyCount+' з 3</b></p>';

  gate.innerHTML =
    '<div class="form-section">' +
      '<p class="form-label">Категорія</p>' +
      '<div class="cat-select-row" id="catSelectRow"></div>' +
    '</div>' +
    '<div class="form-section">' +
      '<p class="form-label">Деталі</p>' +
      '<div class="field"><input id="fTitle" type="text" placeholder="Назва" maxlength="80"></div>' +
      '<div class="field"><textarea id="fDesc" placeholder="Опис" maxlength="400"></textarea></div>' +
      '<div class="field"><input id="fPrice" type="text" placeholder="Ціна" maxlength="40"></div>' +
      '<div class="file-input-wrap">' +
        '<label style="display:block; font-size:10px; color:var(--text-secondary); margin-bottom:4px;">Фото (до 3 шт.)</label>' +
        '<input type="file" accept="image/*" multiple onchange="window.uploadMultipleToImgBB(this, \'fImg\', \'fImgStatus\')">' +
        '<input type="hidden" id="fImg">' +
        '<div id="fImgStatus" style="font-size:10px; color:var(--text-tertiary); margin-top:4px;">Файли не вибрано</div>' +
      '</div>' +
      '<div class="field"><input id="fPhone" type="tel" placeholder="Телефон (опціонально)" maxlength="20"></div>' +
    '</div>' +
    limitBadge +
    '<button class="submit-btn" id="submitBtn" style="margin-top:10px;">Опублікувати</button>' +
    '<p class="hint" style="text-align:center;">Показується у стрічці 24 години</p>';

  const row = document.getElementById("catSelectRow");
  row.innerHTML = state.categories.map(function(c){
    return '<div class="cat-opt'+(state.newCatChoice===c?" active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</div>';
  }).join("");
  row.querySelectorAll(".cat-opt").forEach(function(opt){
    opt.addEventListener("click", function(){
      state.newCatChoice = opt.dataset.cat;
      row.querySelectorAll(".cat-opt").forEach(function(o){ o.classList.remove("active"); });
      opt.classList.add("active");
    });
  });

  document.getElementById("submitBtn").addEventListener("click", async function(){
    const title = document.getElementById("fTitle").value.trim();
    const desc = document.getElementById("fDesc").value.trim();
    const price = document.getElementById("fPrice").value.trim();
    const img = document.getElementById("fImg").value.trim();
    const phone = document.getElementById("fPhone").value.trim();
    if (!title){ showToast("Вкажіть назву оголошення"); return; }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Публікуємо…";
    const item = normalizeItem({
      id: CURRENT_UID + "_" + Date.now(),
      category: state.newCatChoice,
      title: title, desc: desc, price: price, img: img,
      username: tgUser.username || "", phone: phone,
      user_id: CURRENT_UID, user_photo: tgUser.photo_url || "", created_at: Date.now(),
      clicks_phone: 0, clicks_tg: 0
    });
    await submitItem(item);
    state.activeView = "home";
    switchView("home");
    renderAll();
  });
}

function renderProfile(){
  document.getElementById("profAvatar").innerHTML = getAvatarHtml(tgUser.photo_url, DISPLAY_NAME);
  document.getElementById("profName").textContent = DISPLAY_NAME;
  document.getElementById("profId").textContent = "ID: " + CURRENT_UID;

  const mine = state.items.filter(function(i){ return i.user_id === CURRENT_UID; });
  const mineAlive = mine.filter(isAlive);
  const totalClicks = mine.reduce(function(s,i){ return s + i.clicks_phone + i.clicks_tg; }, 0);

  document.getElementById("statGrid").innerHTML =
    '<div class="stat-card"><p class="num">'+mineAlive.length+'</p><p class="lbl">Активні</p></div>' +
    '<div class="stat-card"><p class="num">'+totalClicks+'</p><p class="lbl">Контакти</p></div>' +
    '<div class="stat-card"><p class="num">'+(state.isAdmin ? "Безліміт" : (3 - getUserWeeklyPosts().length)+"/3")+'</p><p class="lbl">Доступно</p></div>';

  const mineEl = document.getElementById("mineList");
  if (!mine.length){
    mineEl.innerHTML = '<div class="empty-state">' + ICONS.empty +
      '<p class="t">Немає оголошень</p><p class="d">Створіть перше оголошення на вкладці «Створити»</p></div>';
  } else {
    mineEl.innerHTML = mine.sort(function(a,b){return b.created_at-a.created_at;}).map(function(i){
      const alive = isAlive(i);
      const thumb = getImages(i)[0];
      const t = fmtClock(timeLeftMs(i));
      return '<div class="mine-row">' +
        (thumb ? '<img src="'+esc(thumb)+'">' : '<div style="width:36px;height:36px;border-radius:8px;background:var(--accent-soft);flex:0 0 auto;"></div>') +
        '<div class="info"><p class="t">'+esc(i.title)+'</p>' +
        '<p class="d"><span class="status-dot '+(alive?"live":"dead")+'"></span>'+(alive?(t==="∞"?"Назавжди":"Активне · "+t+" лишилось"):"Завершено")+' · '+(i.clicks_phone+i.clicks_tg)+' контактів</p></div>' +
      '</div>';
    }).join("");
  }

  const adminSlot = document.getElementById("adminSlot");
  if (state.isAdmin){
    const uniqueUsers = new Set(state.items.map(function(i){ return i.user_id; })).size;
    const activeItems = state.items.filter(isAlive).length;
    const totalClicksGlobal = state.items.reduce(function(s,i){ return s+i.clicks_phone+i.clicks_tg; }, 0);
    adminSlot.innerHTML =
      '<div class="admin-panel">' +
        '<div class="head">'+ICONS.shield+' Панель адміністратора</div>' +
        '<div class="stat-grid" style="margin-bottom:8px;">' +
          '<div class="stat-card"><p class="num">'+uniqueUsers+'</p><p class="lbl">Юзерів</p></div>' +
          '<div class="stat-card"><p class="num">'+activeItems+'</p><p class="lbl">Активних</p></div>' +
          '<div class="stat-card"><p class="num">'+totalClicksGlobal+'</p><p class="lbl">Кліків</p></div>' +
        '</div>' +

        '<p class="form-label" style="margin-top:10px;">Додати банер-постер</p>' +
        '<div class="field"><input id="bTitle" type="text" placeholder="Заголовок банера"></div>' +
        '<div class="field"><input id="bDesc" type="text" placeholder="Короткий опис"></div>' +
        '<div class="file-input-wrap">' +
          '<label style="display:block; font-size:10px; color:var(--text-secondary); margin-bottom:4px;">Постер</label>' +
          '<input type="file" accept="image/*" onchange="window.uploadToImgBB(this, \'bImg\', \'bImgStatus\')">' +
          '<input type="hidden" id="bImg">' +
          '<div id="bImgStatus" style="font-size:10px; color:var(--text-tertiary); margin-top:4px;">Файл не вибрано</div>' +
        '</div>' +
        '<div class="field"><input id="bLink" type="url" placeholder="Посилання при клику (URL)"></div>' +
        '<button class="submit-btn" id="addBannerBtn" style="padding:8px;font-size:12px;margin-bottom:10px;">Додати банер</button>' +
        '<div id="adminBannerList" style="margin-bottom:10px;"></div>' +

        '<p class="form-label">Нова категорія</p>' +
        '<div style="display:flex;gap:4px;margin-bottom:10px;">' +
          '<div class="field" style="flex:1;margin:0;"><input id="cName" type="text" placeholder="Назва"></div>' +
          '<button class="submit-btn" id="addCatBtn" style="width:auto;padding:0 10px;font-size:12px;">+ Додати</button>' +
        '</div>' +

        '<p class="form-label">Модерація оголошень</p>' +
        '<div id="adminItemList"></div>' +
      '</div>';

    const bannerListEl = document.getElementById("adminBannerList");
    bannerListEl.innerHTML = state.banners.map((b, idx) => `
      <div class="admin-item-row">
        <div class="info"><p class="t">${esc(b.title)}</p><p class="d">${esc(b.desc||'Постер')}</p></div>
        <button class="icon-btn" data-delbanner="${idx}">${ICONS.trash}</button>
      </div>
    `).join("");

    bannerListEl.querySelectorAll("[data-delbanner]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.delbanner);
        state.banners.splice(idx, 1);
        persistLocal();
        showToast("Банер видалено");
        renderAll();
      });
    });

    document.getElementById("addBannerBtn").addEventListener("click", async function(){
      const title = document.getElementById("bTitle").value.trim();
      const desc = document.getElementById("bDesc").value.trim();
      const img = document.getElementById("bImg").value.trim();
      const link = document.getElementById("bLink").value.trim();
      if (!title || !img){ showToast("Заповніть назву та завантажте картинку"); return; }
      const newBanner = { id: "b_" + Date.now(), title, desc, img, link };
      state.banners.unshift(newBanner);
      persistLocal();
      await callAppsScript("addBanner", newBanner);
      showToast("Банер додано");
      renderAll();
    });

    document.getElementById("addCatBtn").addEventListener("click", function(){
      const name = document.getElementById("cName").value.trim();
      if (!name) return;
      if (state.categories.includes(name)) { showToast("Категорія вже існує"); return; }
      state.categories.push(name);
      persistLocal();
      callAppsScript("addCategory", { name });
      showToast("Категорію створено");
      renderAll();
    });

    const listEl = document.getElementById("adminItemList");
    const active = state.items.filter(isAlive).sort(function(a,b){return b.created_at-a.created_at;});
    if (!active.length){
      listEl.innerHTML = '<p class="hint">Немає активних оголошень</p>';
    } else {
      listEl.innerHTML = active.map(function(i){
        return '<div class="admin-item-row" data-id="'+esc(i.id)+'">' +
          '<div class="info"><p class="t">'+esc(i.title)+'</p><p class="d">ID '+esc(i.user_id)+' · '+esc(i.category)+'</p></div>' +
          '<button class="icon-btn" data-del="'+esc(i.id)+'">'+ICONS.trash+'</button>' +
        '</div>';
      }).join("");
      listEl.querySelectorAll("[data-del]").forEach(function(btn){
        btn.addEventListener("click", function(){
          const item = state.items.find(function(i){ return i.id === btn.dataset.del; });
          if (item) deleteItemAdmin(item);
        });
      });
    }
  } else {
    adminSlot.innerHTML = "";
  }
}

function switchView(name){
  state.activeView = name;
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  document.getElementById("view-" + name).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(function(b){
    b.classList.toggle("active", b.dataset.view === name);
  });

  if (name === "create") renderCreate();
  if (name === "profile") renderProfile();
  if (name === "chat") renderChat();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
}

if (tg && tg.BackButton) {
  if (state.activeView === "home") {
    tg.BackButton.hide();
  } else {
    tg.BackButton.show();
    tg.BackButton.onClick(function() {
      switchView("home");
    });
  }
}

document.querySelectorAll(".nav-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ switchView(btn.dataset.view); });
});

const searchOverlay = document.getElementById("searchOverlay");
document.getElementById("fabSearch").addEventListener("click", function(){
  searchOverlay.classList.add("active");
  document.getElementById("searchInput").focus();
  renderSearch("");
});
document.getElementById("searchClose").addEventListener("click", function(){
  searchOverlay.classList.remove("active");
});
document.getElementById("searchInput").addEventListener("input", function(e){
  renderSearch(e.target.value.trim().toLowerCase());
});

function renderSearch(q){
  const results = document.getElementById("searchResults");
  const list = state.items.filter(isAlive).filter(function(i){
    if (!q) return true;
    return (i.title||"").toLowerCase().indexOf(q) !== -1 ||
           (i.desc||"").toLowerCase().indexOf(q) !== -1 ||
           (i.category||"").toLowerCase().indexOf(q) !== -1;
  }).sort(function(a,b){ return b.created_at - a.created_at; });
  if (!list.length){
    results.innerHTML = '<div class="empty-state">'+ICONS.empty+'<p class="t">Нічого не знайдено</p><p class="d">Спробуйте інший запит</p></div>';
    return;
  }
  results.innerHTML = '<div class="item-grid">' + list.map(function(i){ return itemCardMiniHtml(i); }).join("") + '</div>';
  bindItemCardActions(results);
}

const favoritesOverlay = document.getElementById("favoritesOverlay");
document.getElementById("favHeaderBtn").addEventListener("click", function(){
  favoritesOverlay.classList.add("active");
  renderFavorites();
});
document.getElementById("favoritesClose").addEventListener("click", function(){
  favoritesOverlay.classList.remove("active");
});
document.getElementById("favoritesBackdrop").addEventListener("click", function(){
  favoritesOverlay.classList.remove("active");
});

function renderFavorites(){
  const results = document.getElementById("favoritesResults");
  const list = state.items.filter(function(i){ return state.favorites.has(i.id); })
    .sort(function(a,b){ return b.created_at - a.created_at; });
  if (!list.length){
    results.innerHTML = '<div class="empty-state">'+ICONS.heart+'<p class="t">Обране порожнє</p><p class="d">Натисніть на сердечко на картці, щоб зберегти оголошення</p></div>';
    return;
  }
  results.innerHTML = '<div class="item-grid">' + list.map(function(i){ return itemCardMiniHtml(i); }).join("") + '</div>';
  bindItemCardActions(results);
}

const filterOverlay = document.getElementById("filterOverlay");
document.getElementById("filterFab").addEventListener("click", openFilterOverlay);
document.getElementById("filterClose").addEventListener("click", function(){
  filterOverlay.classList.remove("active");
});
function openFilterOverlay(){
  const list = document.getElementById("filterList");
  const cats = ["Усі"].concat(state.categories);
  list.innerHTML = cats.map(function(c){
    return '<div class="filter-opt'+(state.activeCategory===c?" active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</div>';
  }).join("");
  list.querySelectorAll(".filter-opt").forEach(function(opt){
    opt.addEventListener("click", function(){
      state.activeCategory = opt.dataset.cat;
      state.visibleCount = CONFIG.PAGE_SIZE;
      renderChips();
      switchView("home");
      renderItemGrid();
      filterOverlay.classList.remove("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
  filterOverlay.classList.add("active");
}

function renderAll(){
  renderTopbar();
  renderBanners();
  renderChips();
  renderItemGrid();
  if (state.activeView === "profile") renderProfile();
  if (state.activeView === "create") renderCreate();
  if (state.activeView === "chat") renderChat();
}

function softUpdate() {
  renderTopbar();
  if (state.activeView === "home" || !state.activeView) {
    renderBanners();
    renderChips();
    renderItemGrid();
  }
  if (state.activeView === "chat") {
    renderChat();
  }
}

setInterval(function(){
  document.querySelectorAll(".mini-ttl").forEach(function(el){
    const card = el.closest(".item-card-mini");
    if (!card) return;
    const item = state.items.find(function(i){ return i.id === card.dataset.id; });
    if (!item) return;
    if (!isAlive(item)) { renderItemGrid(); return; }
    const t = fmtClock(timeLeftMs(item));
    el.textContent = t === "∞" ? "Назавжди" : t;
  });
}, 1000);

setInterval(loadAll, CONFIG.REFRESH_MS);

let lastScrollY = window.scrollY || 0;
let scrollTicking = false;

function handleScroll(){
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  const topbar = document.getElementById("topbar");
  const chipRow = document.getElementById("chipRow");
  const filterFab = document.getElementById("filterFab");
  const scrollTopBtn = document.getElementById("scrollTopBtn");

  if (y > 40) {
    topbar.classList.add("scrolled");
  } else {
    topbar.classList.remove("scrolled");
  }

  if (state.activeView === "home") {
    if (y > 40) {
      chipRow.classList.add("hide-scroll");
      filterFab.classList.add("show");
    } else {
      chipRow.classList.remove("hide-scroll");
      filterFab.classList.remove("show");
    }
  } else {
    chipRow.classList.remove("hide-scroll");
    filterFab.classList.remove("show");
  }

  if (y < lastScrollY - 6 && y > 120) {
    scrollTopBtn.classList.add("show");
  } else if (y > lastScrollY + 6 || y <= 120) {
    scrollTopBtn.classList.remove("show");
  }

  lastScrollY = y;
  scrollTicking = false;
}

window.addEventListener("scroll", function(){
  if (!scrollTicking) {
    requestAnimationFrame(handleScroll);
    scrollTicking = true;
  }
}, { passive: true });

document.getElementById("scrollTopBtn").addEventListener("click", function(){
  window.scrollTo({ top: 0, behavior: "smooth" });
});

loadAll();

})();
</script>
</body>
</html>
